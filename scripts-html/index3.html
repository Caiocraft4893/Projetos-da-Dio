<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario de casastro</title>
</head>
<body>
    <form>
        <label>Digite aqui: </label><input type="text" /><br>
        <label>Number: </label><input type="number" min="0" step="5" max="99" /><br>        <label>Range: </label><input type="range" min="0" value="50" max="100"/><br>
        <label>Color: </label><input type="color"/><br>
        <label>E-mail: </label><input type="email"/><br>
        <label>URL: </label><input type="url"/><br>
        <label>Data: </label><input type="date"/><br>
        <label>week: </label><input type="week"/><br>
        <label>Month: </label><input type="month"/><br>
        <label>Checkbox: </label><input type="checkbox"/></label><input type="checkbox"/><br>
        <label>Radio: </label><input type="radio" name="rola"/></label><input type="radio" name="rola"/><br>
        <label>Hidden: </label><input type="hidden"/><br>
        <label>File: </label><input type="file" multiple/><br>
        <label>Search: </label><input type="search" multiple/><br>
        <label>Button: </label><input type="button" value="Mim dê papai" /><br>

    </form>
</body>
</html>
